name: make-assets

# One-time helper: generates the comedian face candidates, audience cutaways and idle loop
# using your Cloudflare secrets, then gives you a downloadable zip (Artifacts section of the run).
on:
  workflow_dispatch:
    inputs:
      what:
        description: "What to generate"
        type: choice
        options: [face, cutaways, idle]
        default: face
      count:
        description: "How many images (face: 20, cutaways: 12)"
        default: "20"

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg (only needed for the idle loop)
        if: inputs.what == 'idle'
        timeout-minutes: 5
        run: |
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - run: pip install requests Pillow
      - name: Face candidates
        if: inputs.what == 'face'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python tools/generate_face.py --count ${{ inputs.count }}
      - name: Audience cutaways
        if: inputs.what == 'cutaways'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python tools/generate_cutaways.py --count ${{ inputs.count }}
      - name: Idle loop (needs assets/comedian.png committed)
        if: inputs.what == 'idle'
        run: python tools/make_idle.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.what }}
          path: out/
          retention-days: 14
